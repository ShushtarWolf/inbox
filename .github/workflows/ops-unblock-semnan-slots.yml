# One-shot ops: unblock Semnan evening slots via Liara exec WebSocket (URL-encoded cmd).
name: Ops unblock Semnan slots
on:
  workflow_dispatch:

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unblock 21–23 via encoded Liara exec
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          # Zero-whitespace JS so server-side argv split is: node | -e | CODE
          CODE="(async()=>{p=new(require('@prisma/client').PrismaClient);c=await(p.club.findUnique({where:{slug:'club-53cb71'},select:{id:true,nameFa:true}}));if(!c)process.exit(2);r=await(p.slot.updateMany({where:{date:'2026-10-29',startTime:{in:['21:00','22:00','23:00']},displayStatus:'BLOCKED',court:{clubId:c.id}},data:{displayStatus:'FREE'}}));console.log('UPDATED='+r.count);await(p.\$disconnect());process.exit(0)})().catch(e=>{console.error(e);process.exit(1)})"
          if printf '%s' "$CODE" | grep -q '[[:space:]]'; then echo 'whitespace in CODE'; exit 1; fi
          export CODE

          node <<'NODE'
          ;(async () => {
            const token = process.env.LIARA_TOKEN
            const code = process.env.CODE
            if (!token) throw new Error('missing LIARA_TOKEN')
            if (!code || /\s/.test(code)) throw new Error('bad CODE')

            const cmd = `node -e ${code}`
            const url =
              'wss://api.iran.liara.ir/v1/exec'
              + `?token=${encodeURIComponent(token)}`
              + `&cmd=${encodeURIComponent(cmd)}`
              + `&project_id=inbox&teamID=`

            console.log('cmd_len=', cmd.length, 'url_len=', url.length)

            const out = []
            const ws = new WebSocket(url)

            await new Promise((resolve, reject) => {
              const t = setTimeout(() => reject(new Error('exec timeout')), 90000)
              ws.addEventListener('open', async () => {
                await new Promise((r) => setTimeout(r, 1000))
                ws.send(JSON.stringify({ action: 'start', cols: 120, rows: 40 }))
              })
              ws.addEventListener('message', (ev) => {
                const chunk = typeof ev.data === 'string' ? ev.data : Buffer.from(ev.data).toString()
                out.push(chunk)
                process.stdout.write(chunk)
              })
              ws.addEventListener('close', () => {
                clearTimeout(t)
                resolve()
              })
              ws.addEventListener('error', (err) => {
                clearTimeout(t)
                reject(err.error || err)
              })
            })

            const text = out.join('')
            if (!text.includes('UPDATED=')) {
              console.error('No UPDATED= in output')
              process.exit(1)
            }
          })().catch((e) => {
            console.error(e)
            process.exit(1)
          })
          NODE

          echo "Verifying public API…"
          sleep 2
          curl -sS --max-time 20 \
            "https://inboxs.ir/api/slots/available?club=club-53cb71&date=2026-10-29&includeUnavailable=1" \
            | node -e '
              let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
                const slots=JSON.parse(d);
                const late=slots.filter(s=>["21:00","22:00","23:00"].includes(s.startTime));
                const by={};
                for (const s of late) by[s.startTime+"/"+s.displayStatus]=(by[s.startTime+"/"+s.displayStatus]||0)+1;
                console.log(by);
                const blocked=late.filter(s=>s.displayStatus==="BLOCKED");
                if (blocked.length) { console.error("still blocked:", blocked.length); process.exit(1); }
                console.log("ok: no blocked 21-23 slots");
              });
            '
