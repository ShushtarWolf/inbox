# One-shot ops: unblock tonight's blocked evening slots at Semnan (club-53cb71).
name: Ops unblock Semnan slots
on:
  workflow_dispatch:

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unblock via DATABASE_URL from Liara env
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9

          ENV_JSON=$(liara env list --app inbox --api-token="$LIARA_TOKEN" --output json)
          export ENV_JSON
          node <<'NODE'
          const fs = require('fs')
          const raw = process.env.ENV_JSON || ''
          let parsed
          try { parsed = JSON.parse(raw) } catch { parsed = null }
          let url = null
          if (Array.isArray(parsed)) {
            const row = parsed.find((r) => (r.key || r.name) === 'DATABASE_URL')
            url = row && (row.value || row.val)
          } else if (parsed && typeof parsed === 'object') {
            url = parsed.DATABASE_URL || (parsed.data && parsed.data.DATABASE_URL)
          }
          if (!url) {
            for (const line of raw.split('\n')) {
              const m = line.match(/^DATABASE_URL[=:\s]+(.+)$/)
              if (m) { url = m[1].trim().replace(/^["']|["']$/g, ''); break }
            }
          }
          if (!url) {
            console.error('DATABASE_URL not found in liara env list')
            console.error('sample:', raw.slice(0, 800))
            process.exit(1)
          }
          const host = (url.match(/@([^/:]+)/) || [])[1] || '?'
          console.log('DATABASE_URL host=', host)
          fs.writeFileSync('/tmp/db.url', url)
          NODE

          export DATABASE_URL="$(cat /tmp/db.url)"
          rm -f /tmp/db.url

          npm install --no-save --omit=dev --no-audit --no-fund @prisma/client@6.19.3 prisma@6.19.3
          npx prisma generate --schema=prisma/schema.prisma

          node <<'JS'
          const { PrismaClient } = require('@prisma/client')
          const prisma = new PrismaClient()
          ;(async () => {
            const club = await prisma.club.findUnique({
              where: { slug: 'club-53cb71' },
              select: { id: true, nameFa: true },
            })
            if (!club) throw new Error('club not found')
            const result = await prisma.slot.updateMany({
              where: {
                date: '2026-10-29',
                startTime: { in: ['21:00', '22:00', '23:00'] },
                displayStatus: 'BLOCKED',
                court: { clubId: club.id },
              },
              data: { displayStatus: 'FREE' },
            })
            console.log(JSON.stringify({ club: club.nameFa, updated: result.count }))
            await prisma.$disconnect()
          })().catch(async (e) => {
            console.error(e)
            try { await prisma.$disconnect() } catch {}
            process.exit(1)
          })
          JS

          echo "Verifying public API…"
          sleep 2
          curl -sS --max-time 20 \
            "https://inboxs.ir/api/slots/available?club=club-53cb71&date=2026-10-29&includeUnavailable=1" \
            | node -e '
              let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
                const slots=JSON.parse(d);
                const late=slots.filter(s=>["21:00","22:00","23:00"].includes(s.startTime));
                const by={};
                for (const s of late) by[s.startTime+"/"+s.displayStatus]=(by[s.startTime+"/"+s.displayStatus]||0)+1;
                console.log(by);
                const blocked=late.filter(s=>s.displayStatus==="BLOCKED");
                if (blocked.length) { console.error("still blocked:", blocked.length); process.exit(1); }
                console.log("ok: no blocked 21-23 slots");
              });
            '
