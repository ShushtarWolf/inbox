# One-shot ops: unblock Semnan evening slots via liara shell + spaceless node -e.
name: Ops unblock Semnan slots
on:
  workflow_dispatch:

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unblock 21–23 via liara shell
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9

          # Must be ZERO whitespace: liara exec splits cmd on spaces into argv
          # (node, -e, CODE). Also keep short — cmd is a raw WebSocket query param.
          CODE="(async()=>{p=new(require('@prisma/client').PrismaClient);c=await(p.club.findUnique({where:{slug:'club-53cb71'},select:{id:true,nameFa:true}}));if(!c)process.exit(2);r=await(p.slot.updateMany({where:{date:'2026-10-29',startTime:{in:['21:00','22:00','23:00']},displayStatus:'BLOCKED',court:{clubId:c.id}},data:{displayStatus:'FREE'}}));console.log('UPDATED='+r.count);await(p.\$disconnect());process.exit(0)})().catch(e=>{console.error(e);process.exit(1)})"

          if printf '%s' "$CODE" | grep -q '[[:space:]]'; then
            echo 'CODE contains whitespace — abort'
            exit 1
          fi
          echo "CODE_LEN=${#CODE}"

          echo '=== probe /bin/echo ==='
          set +e
          timeout 25s liara shell --app inbox --api-token="$LIARA_TOKEN" -c '/bin/echo SHELL_OK' > /tmp/shell-echo.txt 2>&1
          echo "echo_exit=$?"
          set -e
          cat /tmp/shell-echo.txt

          echo '=== unblock ==='
          set +e
          timeout 90s liara shell --app inbox --api-token="$LIARA_TOKEN" -c "node -e ${CODE}" > /tmp/shell-out.txt 2>&1
          echo "shell_exit=$?"
          set -e
          cat /tmp/shell-out.txt

          if ! grep -q 'UPDATED=' /tmp/shell-out.txt; then
            echo 'Unblock did not report UPDATED='
            exit 1
          fi

          echo "Verifying public API…"
          sleep 2
          curl -sS --max-time 20 \
            "https://inboxs.ir/api/slots/available?club=club-53cb71&date=2026-10-29&includeUnavailable=1" \
            | node -e '
              let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
                const slots=JSON.parse(d);
                const late=slots.filter(s=>["21:00","22:00","23:00"].includes(s.startTime));
                const by={};
                for (const s of late) by[s.startTime+"/"+s.displayStatus]=(by[s.startTime+"/"+s.displayStatus]||0)+1;
                console.log(by);
                const blocked=late.filter(s=>s.displayStatus==="BLOCKED");
                if (blocked.length) { console.error("still blocked:", blocked.length); process.exit(1); }
                console.log("ok: no blocked 21-23 slots");
              });
            '
