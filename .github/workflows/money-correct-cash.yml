name: Correct cash settlements (prod)

# Slice 1 — claw back open CASH SettlementLedgerEntry rows via the live app
# (internal DB). Requires ADMIN_PROVISION_SECRET. Default is dry-run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Set true to APPLY on production (after dry-run review)
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: money-correct-cash
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dry-run or APPLY cash correction on inboxs.ir
        env:
          ADMIN_PROVISION_SECRET: ${{ secrets.ADMIN_PROVISION_SECRET }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PROVISION_SECRET:-}" ]; then
            echo "ADMIN_PROVISION_SECRET missing"
            exit 1
          fi
          QS=""
          if [ "$APPLY_INPUT" = "true" ]; then
            QS="?apply=1"
            echo "APPLY on production"
          else
            echo "Dry-run only"
          fi
          curl -sfS -X POST "https://inboxs.ir/api/admin/money-audit/correct-cash${QS}" \
            -H "x-admin-secret: ${ADMIN_PROVISION_SECRET}" \
            -H "content-type: application/json" \
            | tee /tmp/money-correct.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/money-correct.json'))
          c=d.get('correction') or {}
          a=d.get('audit') or {}
          print(f"openCount={c.get('openCount')} applied={c.get('applied')} ok={c.get('ok')} fail={c.get('fail')}")
          print(f"audit openCash={a.get('openCashSettlements')} alert={a.get('alert')}")
          if c.get('fail'):
            raise SystemExit('correction had failures')
          if c.get('applied') and a.get('openCashSettlements', 0) != 0:
            raise SystemExit('open CASH settlements remain after APPLY')
          PY
