name: Deploy to Liara

on:
  workflow_dispatch:

# One deploy at a time. Do not cancel an in-flight rollout — wait instead.
concurrency:
  group: liara-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

env:
  # Liara pulls public registry images only — GHCR package is set public below.
  IMAGE_NAME: ghcr.io/shushtarwolf/inbox

jobs:
  gate:
    name: Prefer green CI for this SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.pick.outputs.smoke }}
    steps:
      - name: Resolve smoke vs CI skip
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --commit "$GITHUB_SHA" --json conclusion,status --limit 20)
          ok=$(echo "$runs" | jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          if [ "$ok" -gt 0 ]; then
            echo "smoke=skip" >> "$GITHUB_OUTPUT"
            echo "CI already green for ${GITHUB_SHA:0:7} — skipping duplicate smoke rebuild"
          else
            echo "smoke=run" >> "$GITHUB_OUTPUT"
            echo "No successful CI for ${GITHUB_SHA:0:7} — running deploy smoke gate"
          fi

  smoke:
    name: Build and auth smoke gate
    needs: gate
    if: needs.gate.outputs.smoke == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox
          POSTGRES_DB: inbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inbox -d inbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inbox:inbox@localhost:5432/inbox
      NUXT_SESSION_PASSWORD: ci-test-session-password-at-least-32-characters-long
      ADMIN_PROVISION_SECRET: ci-admin-provision-secret-for-smoke-tests
      PAYMENTS_MODE: pay_at_club
      SMS_PROVIDER: log
      BASE_URL: http://127.0.0.1:3000
      CI: true
      ALLOW_DEMO_AUTH: true
      RATE_LIMIT_MAX: 100
      OTP_PHONE_SEND_MAX: 100
      OTP_PHONE_VERIFY_MAX: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without lifecycle duplication
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Prepare Nuxt and Prisma
        run: |
          npx nuxt prepare
          npx prisma generate
          npm run db:migrate:deploy
      - name: Build production server
        run: npm run build
      - name: Start server and run auth smoke
        run: |
          node .output/server/index.mjs > /tmp/inbox-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then break; fi
            sleep 2
          done
          curl -sf "$BASE_URL/api/health" >/dev/null
          status=$(curl -sS -o /tmp/inbox-login-response -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"email":"nobody@example.com","password":"wrong"}' \
            "$BASE_URL/api/auth/login")
          test "$status" = "401"
          ! grep -q 'RATE_LIMIT_STORAGE_NOT_CONFIGURED' /tmp/inbox-login-response
          cat /tmp/inbox-login-response

  build-image:
    name: Build and push image (GitHub, not Liara)
    needs: [gate, smoke]
    if: >-
      always()
      && needs.gate.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: meta
        run: |
          echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Will push ${IMAGE_NAME}:${GITHUB_SHA}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make GHCR package public (Liara requires public registries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Package may not exist until first push; retry briefly.
          for i in 1 2 3 4 5; do
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/inbox/visibility" \
              -f visibility=public; then
              echo "GHCR package inbox is public"
              exit 0
            fi
            echo "visibility update attempt $i failed; sleeping…"
            sleep 5
          done
          echo "::error::Could not set ghcr.io/shushtarwolf/inbox public — Liara cannot pull private images"
          exit 1

  deploy:
    name: Deploy prebuilt image to Liara
    needs: [gate, smoke, build-image]
    if: >-
      always()
      && needs.gate.result == 'success'
      && needs.build-image.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy inbox image to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9
          echo "Deploying ${IMAGE}"
          # --image skips Liara source/Docker build (no BuildKit on their builder).
          timeout 20m liara deploy \
            --app=inbox \
            --image="$IMAGE" \
            --port=3000 \
            --platform=docker \
            --api-token="$LIARA_TOKEN" \
            --no-app-logs \
            --message "GitHub ${GITHUB_SHA:0:7} image"
