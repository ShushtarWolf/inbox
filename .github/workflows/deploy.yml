name: Deploy to Liara

on:
  workflow_dispatch:
    inputs:
      path:
        description: >-
          germany-fast (default) skips Iran and ships Actions-built Nitro to Germany (~7–10m).
          auto = Iran primary then Germany on failure. iran-only = full-source Iran only.
        type: choice
        default: germany-fast
        options:
          - germany-fast
          - auto
          - iran-only

# One deploy at a time. Do not cancel an in-flight rollout — wait instead.
concurrency:
  group: liara-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Prefer green CI for this SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.pick.outputs.smoke }}
      path: ${{ steps.pick.outputs.path }}
    steps:
      - name: Resolve smoke vs CI skip
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_INPUT: ${{ inputs.path || 'germany-fast' }}
        run: |
          set -euo pipefail
          echo "path=$PATH_INPUT" >> "$GITHUB_OUTPUT"
          echo "Deploy path=$PATH_INPUT"
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --commit "$GITHUB_SHA" --json conclusion,status --limit 20)
          ok=$(echo "$runs" | jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          if [ "$ok" -gt 0 ]; then
            echo "smoke=skip" >> "$GITHUB_OUTPUT"
            echo "CI already green for ${GITHUB_SHA:0:7} — skipping duplicate smoke rebuild"
          else
            echo "smoke=run" >> "$GITHUB_OUTPUT"
            echo "No successful CI for ${GITHUB_SHA:0:7} — running deploy smoke gate"
          fi

  smoke:
    name: Build and auth smoke gate
    needs: gate
    if: needs.gate.outputs.smoke == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox
          POSTGRES_DB: inbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inbox -d inbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inbox:inbox@localhost:5432/inbox
      NUXT_SESSION_PASSWORD: ci-test-session-password-at-least-32-characters-long
      ADMIN_PROVISION_SECRET: ci-admin-provision-secret-for-smoke-tests
      PAYMENTS_MODE: pay_at_club
      SMS_PROVIDER: log
      BASE_URL: http://127.0.0.1:3000
      CI: true
      ALLOW_DEMO_AUTH: true
      RATE_LIMIT_MAX: 100
      OTP_PHONE_SEND_MAX: 100
      OTP_PHONE_VERIFY_MAX: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without lifecycle duplication
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Prepare Nuxt and Prisma
        run: |
          npx nuxt prepare
          npx prisma generate
          npm run db:migrate:deploy
      - name: Build production server
        run: npm run build
      - name: Start server and run auth smoke
        run: |
          node .output/server/index.mjs > /tmp/inbox-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then break; fi
            sleep 2
          done
          curl -sf "$BASE_URL/api/health" >/dev/null
          status=$(curl -sS -o /tmp/inbox-login-response -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"email":"nobody@example.com","password":"wrong"}' \
            "$BASE_URL/api/auth/login")
          test "$status" = "401"
          ! grep -q 'RATE_LIMIT_STORAGE_NOT_CONFIGURED' /tmp/inbox-login-response
          cat /tmp/inbox-login-response
      - name: Upload smoke .output for deploy reuse
        uses: actions/upload-artifact@v4
        with:
          name: nitro-output
          path: .output
          include-hidden-files: true
          retention-days: 1

  # Iran full-source: auto (primary) or iran-only. Skipped on germany-fast.
  deploy-iran:
    name: Deploy Iran full-source
    needs: [gate, smoke]
    if: >-
      always()
      && needs.gate.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
      && (needs.gate.outputs.path == 'auto' || needs.gate.outputs.path == 'iran-only')
    runs-on: ubuntu-latest
    # Healthy Iran builds finish in ~9m. Cap CLI at 12m so auto→Germany starts sooner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy full source to Liara (Iran)
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9.7.0
          # Proven path: multi-stage Dockerfile on Liara Iran. No BuildKit mounts.
          # Cap at 12m (healthy ~9m). Stuck Iran must fail so auto→Germany can start.
          # Do not raise this back to 20m/75m — that blocks production.
          # Retry once on transient "Upload failed" / registry blips.
          attempt=1
          max=2
          while [ "$attempt" -le "$max" ]; do
            echo "Liara Iran deploy attempt $attempt/$max"
            set +e
            timeout 12m liara deploy \
              --app=inbox \
              --api-token="$LIARA_TOKEN" \
              --no-app-logs \
              --build-location=iran \
              --message "GitHub ${GITHUB_SHA:0:7} iran-${{ needs.gate.outputs.path }}-a${attempt}"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Liara Iran deploy OK on attempt $attempt"
              exit 0
            fi
            echo "::warning::Liara Iran deploy failed (rc=$rc) on attempt $attempt"
            if [ "$attempt" -eq "$max" ]; then
              exit "$rc"
            fi
            sleep 30
            attempt=$((attempt + 1))
          done
          exit 1

  # Prep Germany context (germany-fast primary, or auto fallback). Skip for iran-only.
  bundle:
    name: Prepare Germany prebuilt context
    needs: [gate, smoke]
    if: >-
      always()
      && needs.gate.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
      && needs.gate.outputs.path != 'iran-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reuse smoke .output when present
        id: artifact
        if: needs.gate.outputs.smoke == 'run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: nitro-output
          path: .output
      - name: Build .output when not reused
        if: needs.gate.outputs.smoke == 'skip' || steps.artifact.outcome != 'success'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npx nuxt prepare
          npx prisma generate
          npm run build
      - name: Assemble thin deploy context
        run: |
          set -euo pipefail
          test -d .output
          test -f .output/server/index.mjs
          rm -rf deploy-context
          mkdir -p deploy-context/scripts
          cp Dockerfile.runtime deploy-context/Dockerfile
          # Non-hidden name so Actions artifacts + Liara archive keep the build.
          cp -a .output deploy-context/nitro-output
          cp package.json deploy-context/package.json
          cp -a prisma deploy-context/prisma
          cp scripts/start-production.mjs deploy-context/scripts/start-production.mjs
          cp -a scripts/lib deploy-context/scripts/lib
          cp -a server deploy-context/server
          cp -a shared deploy-context/shared
          # Do not inherit repo gitignore — Liara CLI respects .gitignore when packing.
          printf '%s\n' '# keep nitro-output' > deploy-context/.gitignore
          cat > deploy-context/liara.json <<'EOF'
          {
            "app": "inbox",
            "platform": "docker",
            "port": 3000,
            "build": { "location": "germany" }
          }
          EOF
          OUT_SIZE=$(du -sm deploy-context/nitro-output | awk '{print $1}')
          echo "nitro-output size MiB: $OUT_SIZE"
          test "$OUT_SIZE" -ge 5
          du -sh deploy-context deploy-context/nitro-output
      - uses: actions/upload-artifact@v4
        with:
          name: liara-deploy-context
          # Trailing slash / glob: artifact root = context files (no nested deploy-context/).
          path: deploy-context/
          include-hidden-files: true
          retention-days: 1

  deploy-germany:
    name: Deploy Germany prebuilt
    needs: [gate, smoke, bundle, deploy-iran]
    # germany-fast: ship now (Iran skipped). auto: only when Iran did not succeed.
    if: >-
      always()
      && needs.gate.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
      && needs.bundle.result == 'success'
      && (
        needs.gate.outputs.path == 'germany-fast'
        || (needs.gate.outputs.path == 'auto' && needs.deploy-iran.result != 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: liara-deploy-context
          path: deploy-context
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify prebuilt context before Liara upload
        run: |
          set -euo pipefail
          if [ ! -f deploy-context/Dockerfile ] && [ -f deploy-context/deploy-context/Dockerfile ]; then
            mv deploy-context/deploy-context /tmp/liara-ctx
            rm -rf deploy-context
            mv /tmp/liara-ctx deploy-context
          fi
          test -f deploy-context/Dockerfile
          test -f deploy-context/nitro-output/server/index.mjs
          du -sh deploy-context deploy-context/nitro-output
          find deploy-context -maxdepth 2 -type d | head -40
      - name: Deploy inbox to Liara (Germany prebuilt)
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          PATH_MODE='${{ needs.gate.outputs.path }}'
          IRAN_RESULT='${{ needs.deploy-iran.result }}'
          if [ "$PATH_MODE" = 'germany-fast' ]; then
            echo "germany-fast path — shipping prebuilt to Germany (Iran skipped)"
          else
            echo "::warning::Iran did not succeed (result=$IRAN_RESULT); falling back to Germany prebuilt"
          fi
          # download-artifact can nest as deploy-context/deploy-context when the upload
          # path was a directory named deploy-context — flatten before liara packs.
          if [ ! -f deploy-context/Dockerfile ] && [ -f deploy-context/deploy-context/Dockerfile ]; then
            echo "Flattening nested deploy-context/deploy-context"
            mv deploy-context/deploy-context /tmp/liara-ctx
            rm -rf deploy-context
            mv /tmp/liara-ctx deploy-context
          fi
          test -f deploy-context/Dockerfile
          test -f deploy-context/nitro-output/server/index.mjs
          ls -la deploy-context | head -30
          npm i -g @liara/cli@9.7.0
          # Liara "Upload failed" is often a transient storage blip — retry with backoff.
          attempt=1
          max=3
          while [ "$attempt" -le "$max" ]; do
            echo "Liara Germany deploy attempt $attempt/$max"
            set +e
            if [ "$attempt" -eq 1 ]; then
              timeout 45m liara deploy \
                --path=deploy-context \
                --app=inbox \
                --api-token="$LIARA_TOKEN" \
                --no-app-logs \
                --build-location=germany \
                --message "GitHub ${GITHUB_SHA:0:7} germany-${PATH_MODE}"
            else
              timeout 45m liara deploy \
                --path=deploy-context \
                --app=inbox \
                --api-token="$LIARA_TOKEN" \
                --no-app-logs \
                --build-location=germany \
                --debug \
                --message "GitHub ${GITHUB_SHA:0:7} germany-${PATH_MODE}-retry${attempt}"
            fi
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Liara Germany deploy OK on attempt $attempt"
              exit 0
            fi
            echo "::warning::Liara Germany deploy failed (rc=$rc) on attempt $attempt"
            if [ "$attempt" -eq "$max" ]; then
              exit "$rc"
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          exit 1

  deploy-ok:
    name: Deploy succeeded (Iran or Germany)
    needs: [deploy-iran, deploy-germany]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require at least one successful deploy path
        run: |
          set -euo pipefail
          iran='${{ needs.deploy-iran.result }}'
          de='${{ needs.deploy-germany.result }}'
          echo "deploy-iran=$iran"
          echo "deploy-germany=$de"
          if [ "$iran" = "success" ] || [ "$de" = "success" ]; then
            echo "Production deploy path OK — live verify still required"
            exit 0
          fi
          echo "::error::Both Iran primary and Germany fallback failed (or were skipped)"
          exit 1

  # Liara "Release created" can still leave public 502. Fail the workflow if prod is dead.
  # always() so a skipped sibling path cannot skip this job when deploy-ok succeeded.
  verify-live:
    name: Verify live inboxs.ir
    needs: [deploy-ok]
    if: always() && needs.deploy-ok.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe https://inboxs.ir/api/health
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/inbox-health.json -w '%{http_code}' --max-time 20 \
              https://inboxs.ir/api/health || echo 000)
            home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              https://inboxs.ir || echo 000)
            echo "try$i health=$code home=$home body=$(head -c 200 /tmp/inbox-health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$home" != "502" ] && grep -q '"ok":true' /tmp/inbox-health.json; then
              echo "Live probe passed"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production is DOWN after deploy (live probe failed). Run liara-iran-deploy.yml."
          exit 1
