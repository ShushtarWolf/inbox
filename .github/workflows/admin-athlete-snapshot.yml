name: Admin athlete snapshot (read-only)

# Pulls existing admin GET APIs for one athlete phone/name. No DB writes.
on:
  workflow_dispatch:
    inputs:
      q:
        description: Phone or name search (e.g. 09022900854 or Behnaz)
        required: true
        default: '09022900854'
        type: string

concurrency:
  group: admin-athlete-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch admin bookings + payments + user
        env:
          ADMIN_PROVISION_SECRET: ${{ secrets.ADMIN_PROVISION_SECRET }}
          Q: ${{ inputs.q }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PROVISION_SECRET:-}" ]; then
            echo "ADMIN_PROVISION_SECRET missing"
            exit 1
          fi
          mkdir -p reports
          ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['Q']))")
          H=(-H "x-admin-secret: ${ADMIN_PROVISION_SECRET}" -H "accept: application/json")
          curl -sfS "https://inboxs.ir/api/admin/users?q=${ENC}" "${H[@]}" | tee reports/users.json
          echo
          curl -sfS "https://inboxs.ir/api/admin/bookings?q=${ENC}&limit=100" "${H[@]}" | tee reports/bookings.json
          echo
          curl -sfS "https://inboxs.ir/api/admin/payments?q=${ENC}&limit=100" "${H[@]}" | tee reports/payments.json
          echo
          # Full ledger when phone looks Iranian (post-deploy athlete-ledger endpoint).
          if echo "$Q" | grep -qE '^09[0-9]{9}$'; then
            curl -sfS "https://inboxs.ir/api/admin/money-audit/athlete-ledger?phone=${ENC}" "${H[@]}" \
              | tee reports/athlete-ledger.json || echo '{"skipped":"athlete-ledger unavailable"}' > reports/athlete-ledger.json
          fi
          python3 - <<'PY'
          import json, os
          users=json.load(open('reports/users.json')).get('users') or []
          books=json.load(open('reports/bookings.json')).get('bookings') or []
          pays=json.load(open('reports/payments.json')).get('payments') or []
          print(f"users={len(users)} bookings={len(books)} payments={len(pays)}")
          for u in users[:5]:
            print(f"USER id={u.get('id')} name={u.get('name')} phone={u.get('phone')} bookingCount={u.get('bookingCount')}")
          for b in books[:40]:
            pay=b.get('payment') or {}
            print(
              f"BOOK {b.get('status')} {b.get('date')} {b.get('startTime')} "
              f"{(b.get('club') or {}).get('slug')} {b.get('courtNameFa')} "
              f"pay={pay.get('amount')}/{pay.get('method')}/{pay.get('status')} "
              f"id={b.get('id')} pid={pay.get('id')}"
            )
          if os.path.exists('reports/athlete-ledger.json'):
            led=json.load(open('reports/athlete-ledger.json'))
            if led.get('user'):
              w=led.get('wallet') or {}
              print(f"LEDGER user={led['user'].get('id')} bookings={len(led.get('bookings') or [])} "
                    f"payments={len(led.get('payments') or [])} walletBal={w.get('balance')} "
                    f"txs={len(w.get('transactions') or [])}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: admin-athlete-snapshot-${{ github.run_id }}
          path: reports/
          retention-days: 7
