# Optional: ping competition admin cron endpoints on production.
# Liara dashboard cron is the reliable ~15 min path — see docs/OPERATIONS.md.
# GitHub schedule is best-effort (often delayed); use as backup only.
#
# Requires repo secret: ADMIN_PROVISION_SECRET (same as Liara inbox app).
# Does NOT deploy or change PAYMENTS_MODE.

name: Competition cron

on:
  schedule:
    # Every 15 minutes (UTC). Prefer Liara cron for reliability.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  competition-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Process registration close (+ bundled stale PENDING expiry)
        run: |
          curl -sf -X POST "https://inboxs.ir/api/admin/competitions/process-registration-close" \
            -H "x-admin-secret: ${ADMIN_PROVISION_SECRET}"
        env:
          ADMIN_PROVISION_SECRET: ${{ secrets.ADMIN_PROVISION_SECRET }}

      - name: Expire stale PENDING entries
        run: |
          curl -sf -X POST "https://inboxs.ir/api/admin/competitions/expire-pending" \
            -H "x-admin-secret: ${ADMIN_PROVISION_SECRET}"
        env:
          ADMIN_PROVISION_SECRET: ${{ secrets.ADMIN_PROVISION_SECRET }}

      # Safe when PACKAGES_ENABLED is off (endpoint is admin-secret only, no packages gate).
      - name: Expire stale PENDING package seats
        run: |
          curl -sf -X POST "https://inboxs.ir/api/admin/packages/expire-pending" \
            -H "x-admin-secret: ${ADMIN_PROVISION_SECRET}"
        env:
          ADMIN_PROVISION_SECRET: ${{ secrets.ADMIN_PROVISION_SECRET }}
        continue-on-error: true
