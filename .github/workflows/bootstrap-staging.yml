name: Bootstrap Liara staging

# One-time (safe to re-run): create inbox-staging app + inbox-staging-db on a
# private network, set safe staging env vars. Does NOT touch production inbox.
on:
  workflow_dispatch:
    inputs:
      database_url:
        description: Optional DATABASE_URL if API does not return DB password (postgresql://…)
        required: false
        type: string
      app_plan:
        description: Override app plan (blank = mirror production inbox)
        required: false
        type: string
      db_plan:
        description: Override DB plan (blank = mirror production inbox-db)
        required: false
        type: string

concurrency:
  group: liara-staging-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create staging app + DB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create staging resources on Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          INPUT_DATABASE_URL: ${{ inputs.database_url }}
          INPUT_APP_PLAN: ${{ inputs.app_plan }}
          INPUT_DB_PLAN: ${{ inputs.db_plan }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9

          API="https://api.liara.ir"
          API_IR="https://api.iran.liara.ir"
          AUTH="Authorization: Bearer ${LIARA_TOKEN}"
          APP_NAME="inbox-staging"
          DB_NAME="inbox-staging-db"
          NET_NAME="inbox-staging-net"
          SITE_URL="https://${APP_NAME}.liara.run"

          api_get() {
            local base="$1" path="$2" out="$3"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' -H "$AUTH" --max-time 60 "${base}/${path}" || echo 000)
            echo "$code"
          }

          api_json() {
            local method="$1" base="$2" path="$3"
            shift 3
            curl -sS -X "$method" -H "$AUTH" -H 'content-type: application/json' \
              --max-time 60 "${base}/${path}" "$@"
          }

          echo "== discover =="
          PROJECTS_JSON=$(api_json GET "$API" v1/projects)
          DBS_JSON=$(api_json GET "$API" v1/databases)
          NETS_JSON=$(api_json GET "$API" v1/networks)

          echo "$PROJECTS_JSON" | jq -r '.projects[]? | "app=\(.project_id // .name) plan=\(.planID) bundle=\(.bundlePlanID)"'
          echo "$DBS_JSON" | jq -r '.databases[]? | "db=\(.hostname) plan=\(.planID) bundle=\(.bundlePlanID) status=\(.status) type=\(.type)"'
          echo "$NETS_JSON" | jq -r '.networks[]? | "net=\(.name) id=\(._id)"'

          PROD=$(echo "$PROJECTS_JSON" | jq -c '.projects[]? | select((.project_id // .name) == "inbox")' | head -1)
          PROD_DB=$(echo "$DBS_JSON" | jq -c '.databases[]? | select(.hostname == "inbox-db")' | head -1)
          if [ -z "$PROD" ]; then
            echo "::error::Production app inbox not found — cannot mirror plan"
            exit 1
          fi
          if [ -z "$PROD_DB" ]; then
            echo "::warning::Production DB inbox-db not found — using small-g2 / postgres defaults"
            PROD_DB='{"planID":"small-g2","bundlePlanID":"pro","type":"postgres"}'
          fi

          APP_PLAN="${INPUT_APP_PLAN:-$(echo "$PROD" | jq -r '.planID')}"
          APP_BUNDLE=$(echo "$PROD" | jq -r '.bundlePlanID // "pro"')
          DB_PLAN="${INPUT_DB_PLAN:-$(echo "$PROD_DB" | jq -r '.planID // "small-g2"')}"
          DB_BUNDLE=$(echo "$PROD_DB" | jq -r '.bundlePlanID // "pro"')
          DB_TYPE=$(echo "$PROD_DB" | jq -r '.type // "postgres"')

          ME_JSON=$(api_json GET "$API" v1/me)
          DB_VERSION=$(echo "$ME_JSON" | jq -r --arg t "$DB_TYPE" '
            (.databaseVersions[$t] // [])
            | map(.value // . // empty)
            | map(tostring)
            | map(select(test("^16")))
            | .[0] // empty
          ')
          if [ -z "$DB_VERSION" ]; then
            DB_VERSION=$(echo "$ME_JSON" | jq -r --arg t "$DB_TYPE" '
              (.databaseVersions[$t] // [])[0].value // (.databaseVersions[$t] // [])[0] // "16"
            ')
          fi

          echo "Using app_plan=$APP_PLAN bundle=$APP_BUNDLE db_type=$DB_TYPE db_plan=$DB_PLAN db_bundle=$DB_BUNDLE db_version=$DB_VERSION"

          NET_ID=$(echo "$NETS_JSON" | jq -r --arg n "$NET_NAME" '.networks[]? | select(.name == $n) | ._id' | head -1)
          if [ -z "$NET_ID" ] || [ "$NET_ID" = "null" ]; then
            echo "Creating network $NET_NAME"
            api_json POST "$API" v1/networks -d "{\"networkName\":\"${NET_NAME}\"}" >/tmp/net-create.json
            NETS_JSON=$(api_json GET "$API" v1/networks)
            NET_ID=$(echo "$NETS_JSON" | jq -r --arg n "$NET_NAME" '.networks[]? | select(.name == $n) | ._id' | head -1)
          fi
          echo "network_id=$NET_ID"
          test -n "$NET_ID" && test "$NET_ID" != "null"

          HAS_APP=$(echo "$PROJECTS_JSON" | jq -r --arg a "$APP_NAME" '.projects[]? | select((.project_id // .name) == $a) | .project_id // .name' | head -1)
          if [ -z "$HAS_APP" ]; then
            echo "Creating app $APP_NAME"
            liara app create \
              --app="$APP_NAME" \
              --platform=docker \
              --plan="$APP_PLAN" \
              --feature-plan="$APP_BUNDLE" \
              --network="$NET_NAME" \
              --api-token="$LIARA_TOKEN" \
              --read-only=false
          else
            echo "App $APP_NAME already exists"
          fi

          # REST create avoids CLI interactive --public-network prompt
          HAS_DB=$(echo "$DBS_JSON" | jq -r --arg d "$DB_NAME" '.databases[]? | select(.hostname == $d) | .hostname' | head -1)
          CREATE_RESP="{}"
          if [ -z "$HAS_DB" ]; then
            echo "Creating database $DB_NAME via API"
            CREATE_RESP=$(api_json POST "$API" v1/databases -d "$(jq -n \
              --arg hostname "$DB_NAME" \
              --arg planID "$DB_PLAN" \
              --arg bundlePlanID "$DB_BUNDLE" \
              --arg type "$DB_TYPE" \
              --arg version "$DB_VERSION" \
              --arg network "$NET_ID" \
              '{hostname:$hostname,planID:$planID,bundlePlanID:$bundlePlanID,type:$type,version:$version,network:$network,publicNetwork:false}')")
            echo "Create response (secrets redacted): $(echo "$CREATE_RESP" | jq 'walk(if type == "object" then with_entries(if (.key|test("pass|secret|token";"i")) then .value="***" else . end) else . end)' 2>/dev/null || echo ok)"
            echo "Waiting for DB RUNNING…"
            for i in $(seq 1 36); do
              DBS_JSON=$(api_json GET "$API" v1/databases)
              STATUS=$(echo "$DBS_JSON" | jq -r --arg d "$DB_NAME" '.databases[]? | select(.hostname == $d) | .status' | head -1)
              echo "try$i status=$STATUS"
              if [ "$STATUS" = "RUNNING" ]; then break; fi
              sleep 10
            done
          else
            echo "Database $DB_NAME already exists"
            DBS_JSON=$(api_json GET "$API" v1/databases)
          fi

          DB_OBJ=$(echo "$DBS_JSON" | jq -c --arg d "$DB_NAME" '.databases[]? | select(.hostname == $d)' | head -1)
          if [ -z "$DB_OBJ" ]; then
            echo "::error::Staging DB not found after create"
            echo "$CREATE_RESP" | head -c 800 || true
            exit 1
          fi

          DB_ID=$(echo "$DB_OBJ" | jq -r '._id // .id')
          echo "db_id=$DB_ID"

          MERGED=$(jq -c -n --argjson a "$DB_OBJ" --argjson b "$CREATE_RESP" '$a * $b')
          for base in "$API" "$API_IR"; do
            for path in \
              "v1/databases/${DB_ID}" \
              "v1/databases/${DB_NAME}"
            do
              code=$(api_get "$base" "$path" /tmp/db-detail.json)
              echo "probe ${base}/${path} -> $code"
              if [ "$code" = "200" ] && jq -e 'type == "object"' /tmp/db-detail.json >/dev/null 2>&1; then
                echo "  top keys: $(jq -r 'keys|join(",")' /tmp/db-detail.json)"
                # Flatten nested .database if present (OpenAPI DB-details shape)
                FLAT=$(jq -c 'if .database then (. * .database) else . end' /tmp/db-detail.json)
                MERGED=$(jq -c -n --argjson a "$MERGED" --argjson b "$FLAT" '$a * $b')
              fi
            done
          done

          echo "Merged keys: $(echo "$MERGED" | jq -r 'keys|join(",")')"

          pick() { echo "$MERGED" | jq -r "$1 // empty"; }

          DB_USER=$(pick '.username // .user // .rootUser // "root"')
          DB_PASS=$(pick '.root_password // .password // .rootPassword // .dbPassword')
          DB_PORT=$(pick '.port // .privatePort // .internalPort // 5432')
          DB_NAME_PG=$(pick '.databaseName // .dbName // .db_name // "postgres"')
          API_URI=$(pick '.uri // .connectionUri // .privateUri // .privateNetworkUri // .DATABASE_URL')

          # Private-network hostname is the DB service name
          DB_HOST_PRIV="$DB_NAME"

          DATABASE_URL="${INPUT_DATABASE_URL:-}"
          if [ -z "$DATABASE_URL" ] && [ -n "$API_URI" ] && [ "$API_URI" != "null" ]; then
            DATABASE_URL="$API_URI"
            echo "Using DATABASE_URL from API uri field"
          fi
          if [ -z "$DATABASE_URL" ] && [ -n "$DB_PASS" ] && [ "$DB_PASS" != "null" ]; then
            ENC_PASS=$(DB_PASS="$DB_PASS" python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['DB_PASS'], safe=''))")
            DATABASE_URL="postgresql://${DB_USER}:${ENC_PASS}@${DB_HOST_PRIV}:${DB_PORT}/${DB_NAME_PG}"
            echo "Constructed DATABASE_URL from API credentials (password redacted)"
          fi

          SESSION=$(openssl rand -hex 24)
          ADMIN=$(openssl rand -hex 20)

          if [ -z "$DATABASE_URL" ]; then
            liara env set \
              --app="$APP_NAME" \
              --api-token="$LIARA_TOKEN" \
              --force \
              "NUXT_PUBLIC_SITE_URL=${SITE_URL}" \
              "NUXT_SESSION_PASSWORD=${SESSION}" \
              "ADMIN_PROVISION_SECRET=${ADMIN}" \
              "SEED_ON_EMPTY=true" \
              "PAYMENTS_MODE=pay_at_club" \
              "SMS_PROVIDER=log" \
              "SMS_ENABLED=false" \
              "EMAIL_ENABLED=false" \
              "ALLOW_DEMO_AUTH=true" \
              "SENTRY_ENVIRONMENT=staging" \
              "PILOT_NO_COACH=false" \
              "COMPETITIONS_ENABLED=false" || true
            {
              echo "## Staging almost ready — DATABASE_URL needed"
              echo ""
              echo "Created app \`${APP_NAME}\`, DB \`${DB_NAME}\`, network \`${NET_NAME}\`."
              echo ""
              echo "Liara API did not return the DB password. Do this once:"
              echo "1. Open [Liara console](https://console.liara.ir) → Databases → **${DB_NAME}**"
              echo "2. Copy the **private network** connection URI"
              echo "3. Re-run:"
              echo ""
              echo '```bash'
              echo "gh workflow run bootstrap-staging.yml --ref main -f database_url='postgresql://…'"
              echo '```'
              echo ""
              echo "Staging URL: ${SITE_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::DATABASE_URL unavailable — paste private URI into workflow input database_url and re-run"
            exit 1
          fi

          echo "Setting staging env on $APP_NAME"
          liara env set \
            --app="$APP_NAME" \
            --api-token="$LIARA_TOKEN" \
            --force \
            "DATABASE_URL=${DATABASE_URL}" \
            "NUXT_PUBLIC_SITE_URL=${SITE_URL}" \
            "NUXT_SESSION_PASSWORD=${SESSION}" \
            "ADMIN_PROVISION_SECRET=${ADMIN}" \
            "SEED_ON_EMPTY=true" \
            "PAYMENTS_MODE=pay_at_club" \
            "SMS_PROVIDER=log" \
            "SMS_ENABLED=false" \
            "EMAIL_ENABLED=false" \
            "ALLOW_DEMO_AUTH=true" \
            "SENTRY_ENVIRONMENT=staging" \
            "PILOT_NO_COACH=false" \
            "COMPETITIONS_ENABLED=false"

          {
            echo "## Staging bootstrap OK"
            echo ""
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| App | \`${APP_NAME}\` |"
            echo "| URL | ${SITE_URL} |"
            echo "| Database | \`${DB_NAME}\` |"
            echo "| Network | \`${NET_NAME}\` |"
            echo "| App plan | \`${APP_PLAN}\` / \`${APP_BUNDLE}\` |"
            echo "| DB plan | \`${DB_PLAN}\` / \`${DB_BUNDLE}\` |"
            echo ""
            echo "Safe defaults: SMS log, payments desk, seed on empty, demo auth on."
            echo ""
            echo "Next: run workflow **Deploy staging** (\`deploy-staging.yml\`)."
            echo ""
            echo "Admin secret lives on the Liara app env (\`ADMIN_PROVISION_SECRET\`) — read from dashboard if needed."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Staging URL: $SITE_URL"
