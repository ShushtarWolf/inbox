name: Deploy staging

# Deploys to Liara app inbox-staging only. Never touches production inbox / inboxs.ir.
on:
  workflow_dispatch:

concurrency:
  group: liara-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Prefer green CI for this SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.pick.outputs.smoke }}
    steps:
      - name: Resolve smoke vs CI skip
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --commit "$GITHUB_SHA" --json conclusion,status --limit 20)
          ok=$(echo "$runs" | jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          if [ "$ok" -gt 0 ]; then
            echo "smoke=skip" >> "$GITHUB_OUTPUT"
            echo "CI already green for ${GITHUB_SHA:0:7} — skipping duplicate smoke rebuild"
          else
            echo "smoke=run" >> "$GITHUB_OUTPUT"
            echo "No successful CI for ${GITHUB_SHA:0:7} — running deploy smoke gate"
          fi

  smoke:
    name: Build and auth smoke gate
    needs: gate
    if: needs.gate.outputs.smoke == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox
          POSTGRES_DB: inbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inbox -d inbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inbox:inbox@localhost:5432/inbox
      NUXT_SESSION_PASSWORD: ci-test-session-password-at-least-32-characters-long
      ADMIN_PROVISION_SECRET: ci-admin-provision-secret-for-smoke-tests
      PAYMENTS_MODE: pay_at_club
      SMS_PROVIDER: log
      BASE_URL: http://127.0.0.1:3000
      CI: true
      ALLOW_DEMO_AUTH: true
      RATE_LIMIT_MAX: 100
      OTP_PHONE_SEND_MAX: 100
      OTP_PHONE_VERIFY_MAX: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without lifecycle duplication
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Prepare Nuxt and Prisma
        run: |
          npx nuxt prepare
          npx prisma generate
          npm run db:migrate:deploy
      - name: Build production server
        run: npm run build
      - name: Start server and run auth smoke
        run: |
          node .output/server/index.mjs > /tmp/inbox-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then break; fi
            sleep 2
          done
          curl -sf "$BASE_URL/api/health" >/dev/null
          status=$(curl -sS -o /tmp/inbox-login-response -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"email":"nobody@example.com","password":"wrong"}' \
            "$BASE_URL/api/auth/login")
          test "$status" = "401"
          ! grep -q 'RATE_LIMIT_STORAGE_NOT_CONFIGURED' /tmp/inbox-login-response
          cat /tmp/inbox-login-response

  deploy-iran:
    name: Deploy staging Iran full-source
    needs: [gate, smoke]
    if: >-
      always()
      && needs.gate.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy full source to Liara staging (Iran)
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9
          timeout 75m liara deploy \
            --app=inbox-staging \
            --api-token="$LIARA_TOKEN" \
            --no-app-logs \
            --build-location=iran \
            --message "GitHub ${GITHUB_SHA:0:7} staging-iran"

  deploy-germany:
    name: Deploy staging Germany prebuilt (fallback)
    needs: [gate, smoke, deploy-iran]
    if: >-
      always()
      && needs.gate.result == 'success'
      && (needs.gate.outputs.smoke == 'skip' || needs.smoke.result == 'success')
      && needs.deploy-iran.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build Nitro output
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npx nuxt prepare
          npx prisma generate
          npm run build
      - name: Assemble thin deploy context
        run: |
          set -euo pipefail
          test -d .output
          test -f .output/server/index.mjs
          rm -rf deploy-context
          mkdir -p deploy-context/scripts
          cp Dockerfile.runtime deploy-context/Dockerfile
          cp -a .output deploy-context/nitro-output
          cp package.json deploy-context/package.json
          cp -a prisma deploy-context/prisma
          cp scripts/start-production.mjs deploy-context/scripts/start-production.mjs
          cp -a scripts/lib deploy-context/scripts/lib
          cp -a server deploy-context/server
          cp -a shared deploy-context/shared
          printf '%s\n' '# keep nitro-output' > deploy-context/.gitignore
          cat > deploy-context/liara.json <<'EOF'
          {
            "app": "inbox-staging",
            "platform": "docker",
            "port": 3000,
            "build": { "location": "germany" }
          }
          EOF
          OUT_SIZE=$(du -sm deploy-context/nitro-output | awk '{print $1}')
          echo "nitro-output size MiB: $OUT_SIZE"
          test "$OUT_SIZE" -ge 5
      - name: Deploy staging to Liara (Germany prebuilt)
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::Staging Iran primary did not succeed (result=${{ needs.deploy-iran.result }}); falling back to Germany prebuilt"
          npm i -g @liara/cli@9
          timeout 45m liara deploy \
            --path=deploy-context \
            --app=inbox-staging \
            --api-token="$LIARA_TOKEN" \
            --no-app-logs \
            --build-location=germany \
            --message "GitHub ${GITHUB_SHA:0:7} staging-germany-fallback"

  deploy-ok:
    name: Staging deploy succeeded
    needs: [deploy-iran, deploy-germany]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require at least one successful staging path
        run: |
          set -euo pipefail
          iran='${{ needs.deploy-iran.result }}'
          de='${{ needs.deploy-germany.result }}'
          echo "deploy-iran=$iran"
          echo "deploy-germany=$de"
          if [ "$iran" = "success" ] || [ "$de" = "success" ]; then
            echo "Staging deploy path OK — live verify still required"
            exit 0
          fi
          echo "::error::Both staging Iran and Germany paths failed (or were skipped)"
          exit 1

  verify-live:
    name: Verify live inbox-staging.liara.run
    needs: [deploy-ok]
    if: always() && needs.deploy-ok.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe https://inbox-staging.liara.run/api/health
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/inbox-staging-health.json -w '%{http_code}' --max-time 20 \
              https://inbox-staging.liara.run/api/health || echo 000)
            home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              https://inbox-staging.liara.run || echo 000)
            echo "try$i health=$code home=$home body=$(head -c 200 /tmp/inbox-staging-health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$home" != "502" ] && grep -q '"ok":true' /tmp/inbox-staging-health.json; then
              echo "Staging live probe passed"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging is DOWN after deploy (live probe failed)."
          exit 1
