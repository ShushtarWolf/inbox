# One-shot / ops: copy SENTRY_DSN → NUXT_PUBLIC_SENTRY_DSN on Liara + restart.
# Actions-built Nitro bakes an empty public DSN, so the browser SDK only gets it
# from the NUXT_PUBLIC_* runtime override.
name: Set Sentry public DSN
on:
  workflow_dispatch:
    inputs:
      app:
        description: Liara app name
        required: true
        default: inbox
        type: choice
        options:
          - inbox
          - inbox-staging

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy Sentry env to NUXT_PUBLIC_* + restart
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9
          liara env list --app="$APP" --api-token="$LIARA_TOKEN" --output=json > /tmp/env.json
          read_env() {
            node -e '
              const s = require("fs").readFileSync("/tmp/env.json", "utf8")
              const rows = JSON.parse(s.slice(s.indexOf("[")))
              const row = rows.find((r) => Object.values(r).includes(process.argv[1]))
              if (row) process.stdout.write(String(row.value ?? Object.values(row).find((v) => v !== process.argv[1])))
            ' "$1"
          }
          DSN=$(read_env SENTRY_DSN)
          if [ -z "$DSN" ]; then
            echo "SENTRY_DSN is not set on ${APP}"
            exit 1
          fi
          echo "::add-mask::$DSN"
          SENTRY_ENV=$(read_env SENTRY_ENVIRONMENT)
          SENTRY_ENV=${SENTRY_ENV:-production}
          rm -f /tmp/env.json

          echo "Setting NUXT_PUBLIC_SENTRY_DSN + NUXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENV} on ${APP}"
          liara env set --app="$APP" --api-token="$LIARA_TOKEN" --force \
            "NUXT_PUBLIC_SENTRY_DSN=${DSN}" \
            "NUXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENV}"
          echo "Restarting ${APP}…"
          liara restart --app="$APP" --api-token="$LIARA_TOKEN"

          if [ "$APP" != "inbox" ]; then
            echo "Non-prod app — skip inboxs.ir health probe"
            exit 0
          fi

          echo "Waiting for health…"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/h -w '%{http_code}' --max-time 15 https://inboxs.ir/api/health || echo 000)
            body=$(cat /tmp/h 2>/dev/null || true)
            echo "try $i: http=$code body=$body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'; then
              echo "Live health OK"
              exit 0
            fi
            sleep 10
          done
          echo "Health probe did not pass"
          exit 1
