<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 1180 1180" width="120" height="120" role="img" aria-label="Loading">
<style>
.p{fill:none;stroke:#C41E1E;stroke-width:70;stroke-miterlimit:10}
